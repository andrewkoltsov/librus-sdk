name: Snyk Security

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "15 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Dependency vulnerability scan
    # GitHub does not expose secrets to PRs from forks, so SNYK_TOKEN is always
    # empty there. Skip instead of failing; the npm audit gate still runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail when SNYK_TOKEN is unavailable
        if: env.SNYK_TOKEN == ''
        run: |
          echo "SNYK_TOKEN GitHub Actions secret is required for Snyk Security."
          exit 1

      - name: Run Snyk dependency scan
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          args: --severity-threshold=high
